<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243e7a">
<meta name="description" content="Recall is an offline-first personal notes app.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>Recall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="win">
<div class="sd">
 <div class="logo">◐ RECALL</div>
 <button class="add" id="nn" title="Alt+N">＋ Add new</button>
 <div class="dots" id="dots"></div>
 <div id="nav"></div>
 <div class="bt"><button id="ex">Export</button><button id="im">Import</button><button id="th">🌓 Theme</button></div>
</div>
<div class="rt">
 <div class="hdr"><h1 id="ttl">My Notes</h1><input id="q" placeholder="🔍 Search (Alt+F)"><button id="installBtn" hidden>⬇ Install app</button><span id="cnt" style="color:var(--mu)"></span></div>
 <div class="ct">
  <div id="fsec">
   <h2>Folders</h2><div class="bc" id="bc"></div>
   <div class="gr" id="fg"></div>
  </div>
  <h2>Notes</h2>
  <div class="tabs" id="rt"></div>
  <div class="chips" id="chips" style="margin-bottom:14px"></div>
  <div class="gr" id="ng"></div>
 </div>
</div>
</div>
<div id="ed" hidden><div class="em">
 <div class="row"><input id="ti" placeholder="Note title"><button id="cl">✕ Close</button></div>
 <div class="row"><input id="summary" placeholder="Short summary (one or two lines)"></div>
 <div class="row"><input id="tg" placeholder="Tags, comma separated"><select id="fo"></select><span class="dots" id="ecol"></span></div>
 <div class="row editor-actions"><button id="saveBtn" class="p">💾 Save</button><button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button><button id="bp">Pin</button><button id="ba">Archive</button><button id="bm">Export .md</button><button id="bd">Trash</button><button id="bf" hidden>Delete forever</button></div>
 <div class="panes"><textarea id="tx" placeholder="Write in Markdown…"></textarea><div id="pv"></div></div>
 <div class="foot"><span id="bl"></span><span id="st"></span></div>
</div></div>
<div id="bk" hidden><div class="em">
 <b id="bh">Backup</b><textarea id="bt"></textarea>
 <div class="row"><button class="p" id="bi">Import pasted data</button><button id="bc2">Close</button></div>
 <span style="color:var(--mu);font-size:12px">Copy this text to keep a backup. To restore, paste JSON or Markdown here and press Import.</span>
</div></div>
<script src="script.js"></script>
</body>
</html>
